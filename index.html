<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .checkout-container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .pay-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .pay-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        /* ألوان مربعات طرق الدفع المخصصة */
        .instapay {
            background-color: #5b21b6; /* بنفسجي هادئ لإنستا باي */
        }
        .vodafone {
            background-color: #dc2626; /* أحمر لفودافون كاش */
        }
        .etisalat {
            background-color: #059669; /* أخضر لإتصالات كاش */
        }
        .orange {
            background-color: #363636; /* برتقالي لأورنج كاش */
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2>Select Payment Method</h2>

        <!-- InstaPay Direct Link -->
        <a href="
https://ipn.eg/S/ashraf_elfakharany_t/instapay/4da38A" class="pay-btn instapay" target="_blank">
            InstaPay
        </a>

        <!-- Vodafone Cash Direct Link / USSD -->
        <a href="" class="pay-btn vodafone">
            Vodafone Cash
        </a>

        <!-- Etisalat Cash -->
        <a href="tel:*511#" class="pay-btn etisalat">
            Etisalat Cash
        </a>

        <!-- Orange Cash -->
        <a href="https://maps.app.goo.gl/UvBsvNZi6t8tc9ss5" class="pay-btn orange">
            Ratings on Google Maps
        </a>
    </div>

</body>
</html>
